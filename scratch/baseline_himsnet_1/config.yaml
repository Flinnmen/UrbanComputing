  optimizer: null
train: {best_metric: null, checkpoint: '', device: cuda, eval_period: 1, eval_train: false, grad_clip: 3.0, max_epoch: 20, output_dir: scratch/baseline_himsnet_1, save_period: 5, test_best_ckpt: false}
