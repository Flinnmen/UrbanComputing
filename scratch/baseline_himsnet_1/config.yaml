model: {_target_: skytraffic.models.HiMSNet, adjacency_hop: 5, attn_agg: true, d_model: 64, global_downsample_factor: 1, layernorm: true, metadata: null, normalize_input: true, scale_output: true, simple_fillna: false, use_drone: true, use_global: true, use_ld: true}
