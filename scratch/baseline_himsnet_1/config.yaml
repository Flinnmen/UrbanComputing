    shuffle: false
  train:
    _target_: torch.utils.data.DataLoader
    batch_size: 8
    collate_fn: null
    dataset: {_target_: skytraffic.data.datasets.SimBarcaMSMT, input_window: 30, pred_window: 30, sample_per_session: 20, split: train, step_size: 3}
